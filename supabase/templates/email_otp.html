<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Better Together 邮箱验证码</title>
  </head>
  <body>
    <h1>Better Together</h1>
    <p>请回到 App，在「邮件中的验证码」输入框中填写以下验证码：</p>
    <p><strong>{{ .Token }}</strong></p>
    <p>验证码仅可使用一次。请使用最新邮件中的验证码；如已过期，请在 App 中重新获取。</p>
    <p>请勿将验证码提供给他人。如果这不是你发起的登录请求，请忽略此邮件。</p>
  </body>
</html>
